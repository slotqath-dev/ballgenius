<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Premium Enter Play Football App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#050506;--bg2:#0b0b0e;--card:#121217;--card2:#191920;--text:#fff;--muted:#a6a6b2;--line:rgba(255,255,255,.1);--red:#f5142f;--red2:#860011;--gold:#ffd36b;--gold2:#b97918;--green:#00d46a;--shadow:0 22px 70px rgba(0,0,0,.48);--radius:24px;--glass:rgba(255,255,255,.055)}
[data-theme="light"]{--bg:#f7f1e7;--bg2:#fff7e7;--card:#ffffff;--card2:#fff3dd;--text:#151013;--muted:#6f6670;--line:rgba(80,20,20,.12);--glass:rgba(255,255,255,.68);--shadow:0 20px 50px rgba(80,30,20,.15)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Kanit',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}body{min-height:100vh;color:var(--text);background:radial-gradient(circle at 8% -10%,rgba(245,20,47,.34),transparent 33%),radial-gradient(circle at 92% 3%,rgba(255,211,107,.22),transparent 25%),linear-gradient(180deg,var(--bg),var(--bg2));overflow-x:hidden}.app{max-width:520px;margin:auto;min-height:100vh;padding:78px 12px 100px;position:relative}.top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(520px,100%);z-index:50;background:linear-gradient(180deg,rgba(5,5,6,.94),rgba(5,5,6,.68));backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}[data-theme="light"] .top{background:rgba(255,248,235,.82)}.top-inner{display:flex;justify-content:space-between;align-items:center;padding:12px}.brand{display:flex;gap:10px;align-items:center}.logo{width:46px;height:46px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,var(--red),#320005);box-shadow:0 12px 36px rgba(245,20,47,.35);font-weight:900;color:#fff;border:1px solid rgba(255,211,107,.35)}.brand h1{font-size:17px;line-height:1;font-weight:900}.brand small{color:var(--gold);font-size:11px}.top-actions{display:flex;gap:8px}.icon{width:41px;height:41px;border-radius:15px;border:1px solid var(--line);background:var(--glass);color:var(--text);font-size:18px}.hero{border-radius:30px;overflow:hidden;position:relative;min-height:280px;background:linear-gradient(145deg,rgba(245,20,47,.72),rgba(0,0,0,.76)),url('https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?auto=format&fit=crop&w=1200&q=80') center/cover;box-shadow:var(--shadow);padding:18px}.hero:after{content:'';position:absolute;inset:auto -30px -85px auto;width:240px;height:240px;border-radius:50%;background:repeating-conic-gradient(from 20deg,rgba(255,255,255,.15) 0 12deg,transparent 12deg 28deg);opacity:.28}.hero>*{position:relative;z-index:2}.badge{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.16);padding:7px 11px;border-radius:999px;font-size:11px;font-weight:900;color:#fff}.dot{width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 16px var(--green);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.72)}}.hero h2{font-size:30px;line-height:1.08;margin:15px 0 8px;font-weight:900;color:#fff}.hero h2 span{color:var(--gold)}.hero p{color:#f4edf0;font-size:13px;line-height:1.6;max-width:370px}.hero-btns{display:grid;grid-template-columns:1.2fr .8fr;gap:9px;margin-top:17px}.btn{border:0;border-radius:18px;padding:13px 14px;font-weight:900;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 12px 30px rgba(245,20,47,.25)}.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1c0902}.btn.ghost{background:var(--glass);border:1px solid var(--line);color:var(--text);box-shadow:none}.ticker{margin:12px 0;display:flex;gap:8px;overflow:auto;scrollbar-width:none}.ticker::-webkit-scrollbar,.league-row::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800;color:var(--text)}.chip.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b0800}.searchbar{display:grid;grid-template-columns:1fr 105px;gap:8px;margin:12px 0}.searchbar input,.searchbar select{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;padding:12px;outline:none}.section{margin-top:16px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.title h3{font-size:18px;font-weight:900}.title span{font-size:12px;color:var(--gold);font-weight:800}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:linear-gradient(180deg,var(--glass),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 35px rgba(0,0,0,.16);padding:13px;cursor:pointer;position:relative;overflow:hidden}.league-row{display:flex;gap:10px;overflow:auto;scrollbar-width:none}.league-card{flex:0 0 132px;text-align:center}.league-card img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:18px;padding:7px}.league-card b{display:block;margin-top:8px;font-size:13px}.league-card small,.muted{color:var(--muted);font-size:11px}.match{padding:14px}.match-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-bottom:11px}.live{color:#fff;background:linear-gradient(135deg,var(--red),var(--red2));padding:4px 8px;border-radius:999px;font-weight:900}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.team{text-align:center;min-width:0}.team img{width:48px;height:48px;background:#fff;border-radius:17px;padding:6px;object-fit:contain}.team b{display:block;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:19px;font-weight:900;color:var(--gold);text-align:center;min-width:52px}.playbtn{margin-top:12px;width:100%;padding:10px;border-radius:15px;border:0;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-weight:900}.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.team-card{text-align:center;padding:12px}.team-card img{width:54px;height:54px;background:#fff;border-radius:18px;padding:6px;object-fit:contain}.team-card b{font-size:11px;display:block;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.table{width:100%;border-collapse:collapse;background:var(--card);border-radius:22px;overflow:hidden;border:1px solid var(--line)}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:11px;text-align:left}.table th{color:var(--muted);font-size:10px}.table tr:last-child td{border-bottom:0}.table img{width:24px;height:24px;background:#fff;border-radius:8px;padding:3px;vertical-align:middle;margin-right:6px}.pts{color:var(--gold);font-weight:900;text-align:right!important}.player{display:flex;gap:10px;align-items:center}.player img{width:54px;height:54px;border-radius:18px;object-fit:cover}.player b{font-size:13px}.stat{margin-top:5px;color:var(--gold);font-size:11px;font-weight:900}.video{height:92px;border-radius:18px;background:linear-gradient(135deg,rgba(245,20,47,.28),rgba(255,211,107,.16)),url('https://images.unsplash.com/photo-1518091043644-c1d4457512c6?auto=format&fit=crop&w=600&q=80') center/cover;display:grid;place-items:center;margin-bottom:8px}.playcircle{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff}.bottom{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(500px,calc(100% - 18px));z-index:60;background:rgba(12,12,15,.88);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:var(--shadow)}[data-theme="light"] .bottom{background:rgba(255,248,235,.9)}.nav{border:0;background:transparent;color:var(--muted);border-radius:18px;padding:7px 3px;font-size:10px;font-weight:800}.nav i{display:block;font-style:normal;font-size:20px}.nav.active{background:linear-gradient(135deg,rgba(245,20,47,.22),rgba(255,211,107,.16));color:var(--text)}.drawer,.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);display:none;align-items:flex-end}.drawer.open,.modal.open{display:flex}.sheet{width:min(520px,100%);margin:auto auto 0;background:var(--bg2);border:1px solid var(--line);border-radius:30px 30px 0 0;box-shadow:var(--shadow);padding:16px;max-height:86vh;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{border:0;background:var(--card);color:var(--text);border-radius:13px;width:38px;height:38px}.detail-hero{height:150px;border-radius:24px;background:linear-gradient(135deg,rgba(245,20,47,.45),rgba(0,0,0,.55)),url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=900&q=80') center/cover;display:flex;align-items:end;padding:14px;margin-bottom:12px}.detail-logo{width:72px;height:72px;border-radius:22px;background:#fff;padding:9px;object-fit:contain}.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:200;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:11px 14px;font-size:12px;color:var(--text)}.skeleton{height:80px;border-radius:22px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}.hidden{display:none!important}@media(max-width:390px){.hero h2{font-size:26px}.team-grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.searchbar{grid-template-columns:1fr}.hero-btns{grid-template-columns:1fr}}
</style>
</head>
<body data-theme="dark">
<header class="top"><div class="top-inner"><div class="brand"><div class="logo">QA</div><div><h1>QA OFFSIDE</h1><small>Premium Football Center</small></div></div><div class="top-actions"><button class="icon" onclick="openDrawer('profile')">👤</button><button class="icon" onclick="toggleTheme()" id="themeBtn">☀️</button></div></div></header>
<main class="app">
<section class="hero"><span class="badge"><span class="dot"></span> LIVE MATCH • PREMIUM</span><h2>หน้าเข้าเล่น <span>บอลครบ</span><br>จบในไฟล์เดียว</h2><p>ตัวอย่างสำหรับรอลง API จริง มีลีก ทีม โปรแกรม ตารางคะแนน ไฮไลท์ ช่องทีวี รายละเอียดทุกหน้า และกดได้ทุกจุด</p><div class="hero-btns"><button class="btn" onclick="openPlay()">▶ เข้าเล่นตอนนี้</button><button class="btn gold" onclick="setTab('live')">ดูบอลสด</button></div></section>
<div class="ticker" id="quickChips"></div>
<div class="searchbar"><input id="q" oninput="render()" placeholder="ค้นหาลีก ทีม นักเตะ แมตช์"><select id="filter" onchange="render()"><option value="all">ทั้งหมด</option><option value="live">สด</option><option value="today">วันนี้</option><option value="fav">Favorite</option></select></div>
<div id="content"></div>
</main>
<nav class="bottom"><button class="nav active" data-tab="home" onclick="setTab('home')"><i>🔥</i>ยอดนิยม</button><button class="nav" data-tab="live" onclick="setTab('live')"><i>⚽</i>สด</button><button class="nav" data-tab="program" onclick="setTab('program')"><i>📅</i>โปรแกรม</button><button class="nav" data-tab="table" onclick="setTab('table')"><i>📊</i>ตาราง</button><button class="nav" data-tab="more" onclick="setTab('more')"><i>☰</i>เพิ่มเติม</button></nav>
<div class="drawer" id="drawer"><div class="sheet"><div class="sheet-head"><h3 id="sheetTitle">รายละเอียด</h3><button class="close" onclick="closeDrawer()">✕</button></div><div id="sheetBody"></div></div></div>
<script>
const logos='https://media.api-sports.io/football/teams/';
const leagueLogos='https://media.api-sports.io/football/leagues/';
const leagues=[{id:39,n:'Premier League',c:'England',l:leagueLogos+'39.png'},{id:140,n:'La Liga',c:'Spain',l:leagueLogos+'140.png'},{id:78,n:'Bundesliga',c:'Germany',l:leagueLogos+'78.png'},{id:135,n:'Serie A',c:'Italy',l:leagueLogos+'135.png'},{id:61,n:'Ligue 1',c:'France',l:leagueLogos+'61.png'},{id:2,n:'Champions League',c:'Europe',l:leagueLogos+'2.png'}];
const teams=[['Liverpool',40,39],['Arsenal',42,39],['Man City',50,39],['Chelsea',49,39],['Man United',33,39],['Tottenham',47,39],['Real Madrid',541,140],['Barcelona',529,140],['Atletico Madrid',530,140],['Bayern Munich',157,78],['Dortmund',165,78],['Leverkusen',168,78],['Inter',505,135],['AC Milan',489,135],['Juventus',496,135],['PSG',85,61],['Marseille',81,61],['Monaco',91,61]].map(x=>({n:x[0],id:x[1],league:x[2],logo:logos+x[1]+'.png',city:'Football City',stadium:x[0]+' Arena'}));
const matches=[['Liverpool','Arsenal','2','1','LIVE 67',39],['Barcelona','Real Madrid','1','1','HT',140],['Bayern Munich','Dortmund','3','0','LIVE 72',78],['Inter','AC Milan','-','-','คืนนี้ 02:00',135],['PSG','Monaco','-','-','พรุ่งนี้ 01:45',61],['Man City','Chelsea','0','0','LIVE 12',39],['Juventus','Inter','-','-','คืนนี้ 23:30',135],['Leverkusen','Bayern Munich','-','-','เสาร์ 20:30',78]].map((m,i)=>({id:i+1,home:team(m[0]),away:team(m[1]),hg:m[2],ag:m[3],status:m[4],league:m[5],time:['18:00','20:30','22:00','23:30','01:45'][i%5]}));
const players=['Mohamed Salah','Bukayo Saka','Erling Haaland','Kylian Mbappe','Jude Bellingham','Harry Kane','Lamine Yamal','Lautaro Martinez','Vinicius Jr','Florian Wirtz'].map((n,i)=>({n,team:teams[i%teams.length].n,photo:`https://i.pravatar.cc/240?img=${25+i}`,goals:22-i,assist:5+i%6,rate:(8.8-i*.12).toFixed(1)}));
let active='home', fav=JSON.parse(localStorage.qaFav||'[]');
function team(n){return teams.find(t=>t.n===n)||teams[0]}
function init(){quickChips.innerHTML=['ทั้งหมด',...leagues.map(x=>x.n)].map((x,i)=>`<button class="chip ${i==0?'active':''}" onclick="chipFilter('${i?x:'all'}',this)">${x}</button>`).join('');render()}
function chipFilter(v,el){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');q.value=v==='all'?'':v;render()}
function setTab(t){active=t;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.tab===t));render();scrollTo({top:0,behavior:'smooth'})}
function byQuery(x){let s=(q.value||'').toLowerCase();return !s||JSON.stringify(x).toLowerCase().includes(s)}
function render(){let html='';if(active==='home')html=home();if(active==='live')html=live();if(active==='program')html=program();if(active==='table')html=tableView();if(active==='more')html=more();content.innerHTML=html}
function home(){return section('ลีกยอดนิยม','กดดูลีก',`<div class="league-row">${leagues.filter(byQuery).map(l=>leagueCard(l)).join('')}</div>`)+section('แมตช์แนะนำ','ครบทุกคู่',`<div class="grid2">${matches.filter(byQuery).slice(0,4).map(matchCard).join('')}</div>`)+section('ทีมทั้งหมด','มีรูปครบ',`<div class="team-grid">${teams.filter(byQuery).slice(0,12).map(teamCard).join('')}</div>`)+section('ไฮไลท์','วิดีโอจำลอง',highlightHTML())+section('ดาวซัลโว','กดดูนักเตะ',`<div class="grid2">${players.filter(byQuery).slice(0,4).map(playerCard).join('')}</div>`)}
function live(){let arr=matches.filter(m=>m.status.includes('LIVE')||m.status==='HT').filter(byQuery);return section('บอลสดทั้งหมด','Live',`<div class="grid2">${arr.map(matchCard).join('')}</div>`)+section('ช่องถ่ายทอดสด','กดเข้าเล่น',channels())}
function program(){return section('โปรแกรมแข่งขัน','วันนี้ / พรุ่งนี้',matches.filter(byQuery).map(m=>`<div class="card" onclick="detailMatch(${m.id})"><div class="match-top"><b>${leagueName(m.league)}</b><span>${m.time}</span></div><div class="teams"><div class="team"><img src="${m.home.logo}"><b>${m.home.n}</b></div><div class="score">VS</div><div class="team"><img src="${m.away.logo}"><b>${m.away.n}</b></div></div></div>`).join(''))}
function tableView(){return leagues.filter(byQuery).map(l=>section('ตาราง '+l.n,l.c,table(l.id))).join('')}
function more(){return section('เมนูเพิ่มเติม','Premium',`<div class="grid2"><button class="card" onclick="openPlay()">🎮 เข้าเล่น</button><button class="card" onclick="openDrawer('profile')">👤 โปรไฟล์</button><button class="card" onclick="openDrawer('favorite')">⭐ ทีมโปรด</button><button class="card" onclick="openDrawer('api')">🔌 จุดต่อ API</button><button class="card" onclick="fakeLoad()">⚡ Loading</button><button class="card" onclick="toast('แจ้งเตือนเปิดแล้ว')">🔔 แจ้งเตือน</button></div>`)+section('ทีมทั้งหมด','เลือกทีม',`<div class="team-grid">${teams.map(teamCard).join('')}</div>`)}
function section(t,s,b){return `<section class="section"><div class="title"><h3>${t}</h3><span>${s}</span></div>${b}</section>`}
function leagueCard(l){return `<div class="card league-card" onclick="detailLeague(${l.id})"><img src="${l.l}"><b>${l.n}</b><small>${l.c}</small></div>`}
function teamCard(t){return `<div class="card team-card" onclick="detailTeam(${t.id})"><img src="${t.logo}"><b>${t.n}</b><small>${leagueName(t.league)}</small></div>`}
function matchCard(m){return `<div class="card match" onclick="detailMatch(${m.id})"><div class="match-top"><span>${leagueName(m.league)}</span><span class="${m.status.includes('LIVE')?'live':''}">${m.status}</span></div><div class="teams"><div class="team"><img src="${m.home.logo}"><b>${m.home.n}</b></div><div class="score">${m.hg} : ${m.ag}</div><div class="team"><img src="${m.away.logo}"><b>${m.away.n}</b></div></div><button class="playbtn" onclick="event.stopPropagation();openPlay()">ชมถ่ายทอดสด</button></div>`}
function playerCard(p){return `<div class="card player" onclick="detailPlayer('${p.n}')"><img src="${p.photo}"><div><b>${p.n}</b><div class="muted">${p.team}</div><div class="stat">⚽ ${p.goals} • 🎯 ${p.assist} • ⭐ ${p.rate}</div></div></div>`}
function table(id){let arr=teams.filter(t=>t.league===id);return `<table class="table"><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th class="pts">PTS</th></tr></thead><tbody>${arr.map((t,i)=>`<tr onclick="detailTeam(${t.id})"><td>${i+1}</td><td><img src="${t.logo}">${t.n}</td><td>30</td><td>${22-i}</td><td>${4+i%3}</td><td>${4+i%4}</td><td class="pts">${70-i*3}</td></tr>`).join('')}</tbody></table>`}
function highlightHTML(){return `<div class="grid2">${['ลูกยิงสุดสวย','ไฮไลท์เต็มเกม','เซฟระดับโลก','จังหวะดราม่า'].map(x=>`<div class="card" onclick="toast('เปิดไฮไลท์: ${x}')"><div class="video"><div class="playcircle">▶</div></div><b>${x}</b><div class="muted">คลิปตัวอย่าง</div></div>`).join('')}</div>`}
function channels(){return `<div class="grid2">${['ช่อง 1 HD','ช่อง 2 Sport','ช่อง 3 Live','ช่อง 4 Premium'].map(x=>`<div class="card" onclick="openPlay()"><b>📺 ${x}</b><div class="muted">พร้อมรับชม</div><button class="playbtn">เข้าเล่น</button></div>`).join('')}</div>`}
function leagueName(id){return (leagues.find(l=>l.id===id)||leagues[0]).n}
function detailLeague(id){let l=leagues.find(x=>x.id===id);openSheet(l.n,`<div class="detail-hero"><img class="detail-logo" src="${l.l}"></div><p class="muted">${l.c} • รวมทีม โปรแกรม ตารางคะแนน และดาวเด่น</p><br>${table(id)}<br><button class="btn" onclick="setTab('program');closeDrawer()">ดูโปรแกรมลีกนี้</button>`)}
function detailTeam(id){let t=teams.find(x=>x.id===id);openSheet(t.n,`<div class="detail-hero"><img class="detail-logo" src="${t.logo}"></div><p><b>ลีก:</b> ${leagueName(t.league)}</p><p><b>สนาม:</b> ${t.stadium}</p><p><b>เมือง:</b> ${t.city}</p><br><button class="btn gold" onclick="toggleFav(${id})">⭐ เพิ่ม/ลบ Favorite</button><br><br><button class="btn" onclick="openPlay()">เข้าเล่นทีมนี้</button>`)}
function detailMatch(id){let m=matches.find(x=>x.id===id);openSheet(`${m.home.n} VS ${m.away.n}`,`<div class="card match"><div class="teams"><div class="team"><img src="${m.home.logo}"><b>${m.home.n}</b></div><div class="score">${m.hg} : ${m.ag}</div><div class="team"><img src="${m.away.logo}"><b>${m.away.n}</b></div></div></div><p><b>ลีก:</b> ${leagueName(m.league)}</p><p><b>เวลา:</b> ${m.time}</p><p><b>สถานะ:</b> ${m.status}</p><br><button class="btn" onclick="openPlay()">▶ เข้าเล่น / ชมสด</button>`)}
function detailPlayer(n){let p=players.find(x=>x.n===n);openSheet(p.n,`<div class="player"><img src="${p.photo}"><div><b>${p.n}</b><div class="muted">${p.team}</div><div class="stat">⚽ ${p.goals} Goals • 🎯 ${p.assist} Assists • ⭐ ${p.rate}</div></div></div><br><button class="btn" onclick="openPlay()">เข้าเล่น</button>`)}
function openDrawer(type){if(type==='profile')openSheet('โปรไฟล์ผู้ใช้',`<div class="card"><b>Guest User</b><p class="muted">โหมดตัวอย่าง Telegram Mini App</p></div><br><button class="btn gold" onclick="openPlay()">เข้าเล่น</button>`);if(type==='favorite')openSheet('ทีมโปรด',fav.length?`<div class="team-grid">${teams.filter(t=>fav.includes(t.id)).map(teamCard).join('')}</div>`:'<p class="muted">ยังไม่มีทีมโปรด กดที่ทีมเพื่อเพิ่มได้เลย</p>');if(type==='api')openSheet('จุดต่อ API ภายหลัง',`<p class="muted">ไฟล์นี้ไม่มีช่อง API ตามที่สั่ง แต่เตรียมตำแหน่งฟังก์ชันไว้แล้ว เช่น fetchLeagues(), fetchFixtures(), fetchStandings()</p><br><div class="card"><code>// TODO: connect real API here</code></div>`)}
function openSheet(t,b){sheetTitle.textContent=t;sheetBody.innerHTML=b;drawer.classList.add('open')}function closeDrawer(){drawer.classList.remove('open')}function toggleFav(id){fav=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];localStorage.qaFav=JSON.stringify(fav);toast('อัปเดต Favorite แล้ว')}
function openPlay(){openSheet('เข้าเล่น',`<div class="detail-hero"></div><h3>พร้อมเข้าเล่น</h3><p class="muted">หน้านี้เป็นตัวอย่าง สามารถเปลี่ยนปุ่มให้ลิงก์ไปเว็บหลักหรือ Telegram WebApp ได้ภายหลัง</p><br><button class="btn">ยืนยันเข้าเล่น</button><br><br><button class="btn ghost" onclick="closeDrawer()">ปิด</button>`)}
function toggleTheme(){let b=document.body;b.dataset.theme=b.dataset.theme==='dark'?'light':'dark';themeBtn.textContent=b.dataset.theme==='dark'?'☀️':'🌙'}
function fakeLoad(){content.innerHTML='<div class="skeleton"></div><br><div class="skeleton"></div><br><div class="skeleton"></div>';setTimeout(render,900)}function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
drawer.addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer()});init();
</script>
</body>
</html>
