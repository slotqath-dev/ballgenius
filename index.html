<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>WINBALL PRO - Enter Play Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--bg2:#120305;--panel:#160608;--card:#1f0b0e;--card2:#2b1014;--text:#fff;--muted:#b9a7a1;--line:rgba(255,255,255,.1);--red:#ff1744;--red2:#b40022;--gold:#ffc533;--gold2:#ff9500;--green:#00d26a;--shadow:0 20px 70px rgba(0,0,0,.5);--radius:24px}
body.light{--bg:#fff7ea;--bg2:#fff1d5;--panel:#fffaf2;--card:#fff;--card2:#fff4df;--text:#22110a;--muted:#7c6256;--line:rgba(105,56,18,.14);--shadow:0 18px 50px rgba(120,54,10,.16)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Kanit',system-ui,sans-serif;-webkit-tap-highlight-color:transparent} body{min-height:100vh;background:radial-gradient(circle at 10% -10%,rgba(255,23,68,.35),transparent 34%),radial-gradient(circle at 90% 8%,rgba(255,197,51,.18),transparent 28%),linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);overflow-x:hidden}.app{max-width:540px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:104px}.top{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#150000,#390006 55%,#120000);border-bottom:1px solid rgba(255,197,51,.14);padding:16px 16px 14px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:27px;font-weight:900;letter-spacing:1px;text-shadow:0 3px 0 #000}.logo span{color:var(--gold)}.toggle{display:flex;gap:7px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px}.toggle button{width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer}.toggle button.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#180000}.page{padding:14px}.hero{position:relative;overflow:hidden;border-radius:28px;border:1px solid rgba(255,197,51,.22);background:linear-gradient(135deg,rgba(255,23,68,.36),rgba(31,0,0,.94)),url('https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?auto=format&fit=crop&w=900&q=80') center/cover;min-height:245px;padding:20px;box-shadow:var(--shadow)}.hero:after{content:'';position:absolute;right:-30px;bottom:-35px;width:240px;height:240px;background:url('https://media.api-sports.io/football/players/276.png') center/contain no-repeat;opacity:.32}.pill{display:inline-flex;gap:8px;align-items:center;background:linear-gradient(90deg,var(--red),var(--red2));padding:8px 12px;border-radius:999px;font-size:12px;font-weight:900}.dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.4;transform:scale(.7)}}.hero h1{position:relative;z-index:2;margin-top:16px;font-size:34px;line-height:1.06;font-weight:900}.hero h1 b{color:var(--gold)}.hero p{position:relative;z-index:2;margin-top:9px;color:#f8e7d2;font-size:13px;line-height:1.6;max-width:360px}.btns{position:relative;z-index:2;margin-top:18px;display:grid;grid-template-columns:1.25fr .75fr;gap:10px}.btn{border:0;border-radius:18px;padding:14px 12px;font-weight:900;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--red),#e00055);box-shadow:0 16px 40px rgba(255,23,68,.25)}.btn.gold{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#210000}.title{margin:24px 2px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.title h2{font-size:18px;color:var(--gold);font-weight:900}.title button{border:0;border-radius:999px;padding:8px 12px;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#210000;font-weight:900;cursor:pointer}.league-row{display:flex;gap:10px;overflow:auto;padding-bottom:4px;scrollbar-width:none}.league-row::-webkit-scrollbar{display:none}.league-chip{min-width:76px;height:64px;border-radius:17px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));display:grid;place-items:center;gap:2px;color:var(--text);font-size:10px;font-weight:800;cursor:pointer}.league-chip img{width:30px;height:30px;object-fit:contain;background:#fff;border-radius:9px;padding:3px}.league-chip.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#210000;border-color:transparent}.grid{display:grid;gap:12px}.match-card,.big-card,.menu-card,.team-card,.video-card,.channel-card{border:1px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));border-radius:24px;box-shadow:0 12px 32px rgba(0,0,0,.18);overflow:hidden}.match-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:800}.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:linear-gradient(90deg,var(--red),#e00055);color:white;font-size:11px}.time{background:rgba(255,197,51,.12);color:var(--gold);padding:7px 10px;border-radius:999px}.match-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:22px 16px}.club{text-align:center;font-weight:900}.club img{width:62px;height:62px;object-fit:contain;background:#fff;border-radius:18px;padding:8px;margin-bottom:8px}.score{font-size:24px;font-weight:900;color:var(--gold);display:flex;gap:8px;align-items:center}.score span{background:rgba(255,197,51,.12);border:1px solid rgba(255,197,51,.18);padding:6px 13px;border-radius:10px}.watch{margin:0 16px 16px;width:calc(100% - 32px);border:0;border-radius:16px;padding:14px;background:linear-gradient(90deg,var(--red),#e00055);color:#fff;font-weight:900;cursor:pointer}.video-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.thumb{height:112px;background:center/cover;border-radius:18px 18px 0 0;position:relative}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--red),#ff5d37);display:grid;place-items:center;color:white;font-weight:900}.video-card p{padding:9px;font-size:12px;font-weight:800;line-height:1.35}.tabs{display:flex;gap:9px;overflow:auto;padding-bottom:4px}.tab{white-space:nowrap;border:0;border-radius:999px;padding:11px 15px;background:var(--card2);color:var(--text);font-weight:900;cursor:pointer;border:1px solid var(--line)}.tab.active{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#210000}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,var(--card2),var(--card))}table{width:100%;border-collapse:collapse;min-width:470px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}th{color:var(--muted);font-size:10px}td.rank{color:var(--gold);font-weight:900}.team-cell{display:flex;align-items:center;gap:8px;font-weight:900}.team-cell img{width:25px;height:25px;background:#fff;border-radius:7px;padding:2px}.pts{color:var(--gold);font-weight:900}.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.team-card{padding:14px;cursor:pointer}.team-card img{width:54px;height:54px;background:#fff;border-radius:15px;padding:6px}.team-card h4{margin-top:8px;font-size:14px}.team-card p{font-size:11px;color:var(--muted)}.program-card{border-radius:24px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));margin-bottom:12px}.program-title{display:flex;align-items:center;justify-content:space-between;padding:16px}.program-title b{font-size:17px}.game{display:grid;grid-template-columns:55px 1fr 36px;align-items:center;gap:10px;margin:0 12px 12px;padding:12px;border-radius:17px;background:rgba(0,0,0,.18);cursor:pointer}.game-team{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px}.game-team img{width:26px;height:26px;background:#fff;border-radius:7px;padding:2px}.more-list{display:grid;gap:12px}.menu-card{padding:16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.menu-left{display:flex;align-items:center;gap:14px}.ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--red),#e00055);font-size:24px}.sub{font-size:12px;color:var(--muted)}.channels{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.channel-card{padding:14px 8px;text-align:center;cursor:pointer;min-height:100px}.channel-card img{width:48px;height:48px;object-fit:contain;background:white;border-radius:12px;padding:6px}.channel-card b{display:block;font-size:11px;margin-top:8px}.bottom{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(520px,calc(100% - 18px));z-index:70;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:24px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:var(--shadow)}.nav{border:0;background:transparent;color:var(--muted);border-radius:17px;padding:9px 3px;font-size:10px;font-weight:900;cursor:pointer}.nav i{display:block;font-style:normal;font-size:22px}.nav.active{background:linear-gradient(135deg,var(--red),#e00055);color:white}.back{display:none;border:0;background:transparent;color:#fff;font-size:26px;margin-right:8px;cursor:pointer}.top.detail .back{display:block}.top-left{display:flex;align-items:center}.detail-box{animation:fade .2s ease}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:#190507;color:#fff;border:1px solid rgba(255,197,51,.25);padding:12px 16px;border-radius:15px;z-index:999;font-size:13px;box-shadow:var(--shadow)}@media(max-width:390px){.hero h1{font-size:29px}.video-grid{grid-template-columns:1fr}.channels{grid-template-columns:1fr 1fr}.club img{width:52px;height:52px}.score{font-size:20px}.score span{padding:5px 10px}}
</style>
</head>
<body>
<div class="app">
<header id="top" class="top"><div class="top-left"><button class="back" onclick="goHome()">‹</button><div class="logo">WIN<span>PLAY</span></div></div><div class="toggle"><button id="darkBtn" class="active" onclick="setTheme('dark')">🌙</button><button id="lightBtn" onclick="setTheme('light')">☀️</button></div></header>
<main id="content" class="page"></main>
<nav class="bottom" id="bottom"></nav>
</div>
<script>
const leagues=[
{id:'all',name:'ทั้งหมด',logo:'https://cdn-icons-png.flaticon.com/512/53/53283.png',country:'World'},
{id:'epl',name:'พรีเมียร์ลีก',logo:'https://media.api-sports.io/football/leagues/39.png',country:'England'},
{id:'laliga',name:'ลาลีกา',logo:'https://media.api-sports.io/football/leagues/140.png',country:'Spain'},
{id:'bundes',name:'บุนเดสลีกา',logo:'https://media.api-sports.io/football/leagues/78.png',country:'Germany'},
{id:'seriea',name:'เซเรีย อา',logo:'https://media.api-sports.io/football/leagues/135.png',country:'Italy'},
{id:'ligue1',name:'ลีกเอิง',logo:'https://media.api-sports.io/football/leagues/61.png',country:'France'},
{id:'ucl',name:'ยูฟ่า',logo:'https://media.api-sports.io/football/leagues/2.png',country:'Europe'}];
const teams={
epl:[[42,'Arsenal'],[50,'Manchester City'],[33,'Manchester United'],[40,'Liverpool'],[49,'Chelsea'],[66,'Aston Villa'],[35,'Bournemouth'],[746,'Sunderland'],[51,'Brighton'],[55,'Brentford'],[36,'Fulham'],[34,'Newcastle'],[45,'Everton'],[63,'Leeds'],[52,'Crystal Palace'],[65,'Nottingham Forest'],[47,'Tottenham'],[48,'West Ham'],[44,'Burnley'],[39,'Wolves']],
laliga:[[541,'Real Madrid'],[529,'Barcelona'],[530,'Atletico Madrid'],[548,'Real Sociedad'],[532,'Valencia'],[533,'Villarreal'],[536,'Sevilla'],[543,'Real Betis'],[546,'Getafe'],[538,'Celta Vigo']],
bundes:[[157,'Bayern Munich'],[165,'Dortmund'],[173,'RB Leipzig'],[168,'Bayer Leverkusen'],[169,'Eintracht Frankfurt'],[161,'Wolfsburg'],[163,'Borussia Monchengladbach'],[160,'SC Freiburg'],[167,'Hoffenheim'],[172,'VfB Stuttgart']],
seriea:[[505,'Inter'],[489,'AC Milan'],[496,'Juventus'],[492,'Napoli'],[497,'AS Roma'],[487,'Lazio'],[499,'Atalanta'],[500,'Bologna'],[502,'Fiorentina'],[488,'Sassuolo']],
ligue1:[[85,'PSG'],[81,'Marseille'],[80,'Lyon'],[91,'Monaco'],[79,'Lille'],[94,'Rennes'],[95,'Strasbourg'],[84,'Nice'],[116,'Lens'],[106,'Nantes']],
ucl:[[541,'Real Madrid'],[529,'Barcelona'],[157,'Bayern Munich'],[50,'Manchester City'],[40,'Liverpool'],[505,'Inter'],[496,'Juventus'],[85,'PSG'],[165,'Dortmund'],[489,'AC Milan']]
};
const imgs=['https://images.unsplash.com/photo-1518091043644-c1d4457512c6?auto=format&fit=crop&w=600&q=80','https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=600&q=80','https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=600&q=80','https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=600&q=80'];
let page='home', league='all', detail=null;
function logo(id){return `https://media.api-sports.io/football/teams/${id}.png`}
function flatTeams(l=league){let arr=l==='all'?Object.values(teams).flat():teams[l]; return arr.map(x=>({id:x[0],name:x[1],logo:logo(x[0]),league:l==='all'?'รวมลีก':leagues.find(a=>a.id===l)?.name}))}
function fixtures(l=league){let arr=flatTeams(l); let out=[]; for(let i=0;i<Math.min(arr.length-1,12);i+=2){out.push({home:arr[i],away:arr[i+1],h:(i+2)%4,a:(i+1)%3,time:['18:00','19:30','21:00','02:00'][i%4],status:i%3===0?'LIVE':'วันนี้',league:leagues.find(x=>x.id===l)?.name||'รวมลีก'});} return out}
function standings(l=league){return flatTeams(l).slice(0,20).map((t,i)=>({rank:i+1,...t,p:38,w:26-i>3?26-i:8,d:7+i%5,lose:5+i%7,pts:85-i*3+(i%2)}))}
function leagueChips(){return `<div class="league-row">${leagues.map(x=>`<button class="league-chip ${league===x.id?'active':''}" onclick="setLeague('${x.id}')"><img src="${x.logo}"><span>${x.name}</span></button>`).join('')}</div>`}
function title(t,btn='ดูทั้งหมด'){return `<div class="title"><h2>${t}</h2><button onclick="toast('เปิด ${t}')">${btn}</button></div>`}
function matchCard(f){return `<div class="match-card" onclick="openMatch('${f.home.id}','${f.away.id}')"><div class="match-head"><span><span class="badge">🔥 HOT</span> ${f.league}</span><span class="time">${f.status} ${f.time}</span></div><div class="match-body"><div class="club"><img src="${f.home.logo}"><div>${f.home.name}</div></div><div class="score"><span>${f.h}</span>VS<span>${f.a}</span></div><div class="club"><img src="${f.away.logo}"><div>${f.away.name}</div></div></div><button class="watch" onclick="event.stopPropagation();toast('ตัวอย่างปุ่มเข้าเล่น / ชมสด')">คลิกเพื่อรับชมถ่ายทอดสด</button></div>`}
function videos(n=6){return `<div class="video-grid">${Array.from({length:n},(_,i)=>`<div class="video-card" onclick="openVideo(${i})"><div class="thumb" style="background-image:url('${imgs[i%imgs.length]}')"><div class="play">▶</div></div><p>#ไฮไลท์ฟุตบอล | ${flatTeams()[i%flatTeams().length].name} ${i+1} - ${i%3} คู่แข่ง รวมช็อตเด็ด</p></div>`).join('')}</div>`}
function table(){return `<div class="table-wrap"><table><thead><tr><th>#</th><th>ทีม</th><th>แข่ง</th><th>ชนะ</th><th>เสมอ</th><th>แพ้</th><th>แต้ม</th></tr></thead><tbody>${standings().map(r=>`<tr onclick="openTeam(${r.id})"><td class="rank">${r.rank}</td><td><div class="team-cell"><img src="${r.logo}">${r.name}</div></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.lose}</td><td class="pts">${r.pts}</td></tr>`).join('')}</tbody></table></div>`}
function home(){return `<section class="hero"><span class="pill"><i class="dot"></i> ENTER PLAY CENTER</span><h1>หน้าเข้าเล่น <b>บอลครบ</b> ทุกลีก ทุกทีม</h1><p>ตัวอย่างพร้อมรอลง API ภายหลัง กดได้ทุกเมนู ทุกหัวข้อ มีโหมดสว่าง/มืด และข้อมูลจำลองครบในไฟล์เดียว</p><div class="btns"><button class="btn" onclick="setPage('live')">▶ เข้าเล่นตอนนี้</button><button class="btn gold" onclick="setPage('program')">📅 โปรแกรม</button></div></section>${title('ลีกยอดนิยม','ทั้งหมด')}${leagueChips()}${title('โปรแกรมบอลวันนี้')}${fixtures().slice(0,2).map(matchCard).join('')}${title('ไฮไลท์ยอดนิยม')}${videos(4)}${title('ตารางคะแนน','เพิ่มเติม')}<div class="tabs">${leagues.slice(1).map(x=>`<button class="tab ${league===x.id?'active':''}" onclick="setLeague('${x.id}')"><img src="${x.logo}" style="width:18px;vertical-align:middle"> ${x.name}</button>`).join('')}</div>${table()}`}
function live(){return `${title('ถ่ายทอดสดตอนนี้','รีเฟรช')}<p style="margin:0 4px 12px;color:var(--muted)">● ${fixtures().length} แมตช์สด</p>${fixtures().map(matchCard).join('')}`}
function program(){let fs=fixtures();return `${title('โปรแกรมแข่งขัน','7 ลีก')}${leagueChips()}<div style="display:flex;justify-content:space-between;margin:16px 4px"><button class="tab active">25 แมตช์</button><button class="tab">7 ลีก</button></div>${leagues.slice(1).map(l=>`<div class="program-card"><div class="program-title" onclick="setLeague('${l.id}')"><div><b>${l.name}</b><div class="sub">${l.country}</div></div><button class="tab">${fixtures(l.id).length} แมตช์</button></div>${fixtures(l.id).slice(0,3).map(f=>`<div class="game" onclick="openMatch('${f.home.id}','${f.away.id}')"><b>${f.time}</b><div><div class="game-team"><img src="${f.home.logo}">${f.home.name} <span style="margin-left:auto;color:var(--gold)">${f.h}</span></div><div class="game-team"><img src="${f.away.logo}">${f.away.name} <span style="margin-left:auto;color:var(--gold)">${f.a}</span></div></div><b>›</b></div>`).join('')}</div>`).join('')}`}
function teamsPage(){return `${title('ทีมทั้งหมด','${flatTeams().length} ทีม')}${leagueChips()}<div class="team-grid">${flatTeams().map(t=>`<div class="team-card" onclick="openTeam(${t.id})"><img src="${t.logo}"><h4>${t.name}</h4><p>${t.league} • ข้อมูลทีม / โปรแกรม / ผลงาน</p></div>`).join('')}</div>`}
function more(){return `${title('เพิ่มเติม','เมนู') }<div class="more-list"><div class="menu-card" onclick="setPage('teams')"><div class="menu-left"><div class="ico">🧩</div><div><h3>ลีกและทีม</h3><div class="sub">ข้อมูลลีกและทีมทั้งหมด</div></div></div><b>›</b></div><div class="menu-card" onclick="showHighlights()"><div class="menu-left"><div class="ico">🎥</div><div><h3>ไฮไลท์</h3><div class="sub">วิดีโอไฮไลท์</div></div></div><b>›</b></div><div class="menu-card" onclick="showChannels()"><div class="menu-left"><div class="ico">📺</div><div><h3>ช่องทีวี</h3><div class="sub">ช่องถ่ายทอดสดทั้งหมด</div></div></div><b>›</b></div><div class="menu-card" onclick="setTheme(document.body.classList.contains('light')?'dark':'light')"><div class="menu-left"><div class="ico">🌓</div><div><h3>เปลี่ยนโหมด</h3><div class="sub">สว่าง / มืด</div></div></div><b>›</b></div></div><div style="text-align:center;margin-top:40px;color:var(--muted)">เวอร์ชันตัวอย่าง 1.0.0<br>พร้อมรอลง API</div>`}
function channels(){return `${title('ช่องทีวี','ทั้งหมด')}<div class="channels">${['AIS PLAY 3','AIS PLAY 4','beIN Sports 1','beIN Sports 2','Digi Sport 1','Digi Sport 2','SPORT TV 1','SPORT TV 2','Fox Sport 2','Diema Sport 3','True Sport 2','Arena Sport'].map((c,i)=>`<div class="channel-card" onclick="toast('เปิดช่อง ${c}')"><img src="https://dummyimage.com/90x90/ffffff/111111.png&text=${encodeURIComponent(c.split(' ')[0])}"><b>${c}</b></div>`).join('')}</div>`}
function highlights(){return `${title('ไฮไลท์','กลับ')} ${videos(12)}`}
function detailPage(){return `<div class="detail-box">${detail}</div>`}
function render(){document.getElementById('top').classList.toggle('detail',page==='detail'); let c=document.getElementById('content'); if(page==='home')c.innerHTML=home(); if(page==='live')c.innerHTML=live(); if(page==='program')c.innerHTML=program(); if(page==='teams')c.innerHTML=teamsPage(); if(page==='more')c.innerHTML=more(); if(page==='channels')c.innerHTML=channels(); if(page==='highlights')c.innerHTML=highlights(); if(page==='detail')c.innerHTML=detailPage(); renderNav(); window.scrollTo({top:0,behavior:'smooth'});}
function renderNav(){let navs=[['home','🔥','ยอดนิยม'],['live','⚽','สด'],['program','📅','โปรแกรม'],['teams','🏆','ทีม'],['more','▦','เพิ่มเติม']];bottom.innerHTML=navs.map(n=>`<button class="nav ${page===n[0]?'active':''}" onclick="setPage('${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`).join('')}
function setPage(p){page=p;render()} function setLeague(l){league=l;render()} function goHome(){page='home';detail=null;render()} function showChannels(){page='channels';render()} function showHighlights(){page='highlights';render()}
function openTeam(id){let t=flatTeams('all').find(x=>x.id==id)||flatTeams()[0]; detail=`<div class="team-card" style="text-align:center"><img src="${t.logo}" style="width:96px;height:96px"><h2>${t.name}</h2><p>${t.league}</p></div>${title('ข้อมูลทีม','ตัวอย่าง')}<div class="big-card" style="padding:16px"><p>ฟอร์มล่าสุด: ชนะ 3 เสมอ 1 แพ้ 1</p><p>สนาม: Main Stadium</p><p>โค้ช: Demo Coach</p><p>สถานะ: พร้อมเชื่อม API จริง</p></div>${title('แมตช์ของทีม')}${fixtures('all').slice(0,3).map(matchCard).join('')}`; page='detail';render()}
function openMatch(h,a){let ht=flatTeams('all').find(x=>x.id==h), at=flatTeams('all').find(x=>x.id==a); detail=`${matchCard({home:ht,away:at,h:2,a:1,time:'19:30',status:'LIVE',league:'แมตช์ตัวอย่าง'})}${title('รายละเอียดแมตช์','สถิติ')}<div class="big-card" style="padding:16px"><p>ครองบอล: ${ht.name} 54% - 46% ${at.name}</p><p>ยิงทั้งหมด: 12 - 9</p><p>เตะมุม: 6 - 4</p><p>ใบเหลือง: 1 - 2</p></div>`;page='detail';render()}
function openVideo(i){detail=`${title('ไฮไลท์ฟุตบอล','เล่นวิดีโอ')}<div class="video-card"><div class="thumb" style="height:230px;background-image:url('${imgs[i%imgs.length]}')"><div class="play">▶</div></div><p>คลิปไฮไลท์ตัวอย่าง พร้อมเชื่อมลิงก์วิดีโอจริงภายหลัง</p></div>`;page='detail';render()}
function setTheme(t){document.body.classList.toggle('light',t==='light');darkBtn.classList.toggle('active',t==='dark');lightBtn.classList.toggle('active',t==='light');localStorage.setItem('theme',t)}
function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
setTheme(localStorage.getItem('theme')||'dark');render();
</script>
</body>
</html>
